[project]
name = "autonomous-data-analysis-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "babu2004", email = "132599446+babu2004@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
autonomous-data-analysis-agent = "autonomous_data_analysis_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
